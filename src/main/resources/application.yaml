spring:
  application:
    name: app-waymates-service-registry
server:
  port: ${SERVER_PORT:8761}
eureka:
  server:
    response-cache-update-interval-ms: 5000
  client:
    register-with-eureka: false
    fetch-registry: false
management:
  endpoints:
    web:
      exposure:
        include: health,info
